version: '3.8'

services:
  # 大乐透预测系统主服务
  dlt-prediction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlt-prediction-system
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # 持久化数据目录
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./models:/app/models
      - ./output:/app/output
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - TZ=Asia/Shanghai
      - DLT_AUTO_UPDATE_ENABLED=true
      - DLT_AUTO_UPDATE_TIME=00:01
      - DLT_AUTO_UPDATE_SOURCE=zhcw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dlt-network

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: dlt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dlt-prediction
    networks:
      - dlt-network

  # Redis缓存 (可选，用于分布式缓存)
  redis:
    image: redis:alpine
    container_name: dlt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - dlt-network

  # 监控服务 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: dlt-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - dlt-network

  # Grafana仪表板 (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: dlt-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - dlt-network

# 网络配置
networks:
  dlt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
