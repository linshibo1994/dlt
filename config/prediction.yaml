# 预测配置文件
# Prediction Configuration

# 复式预测配置
compound_prediction:
  # 前区号码范围
  front_range:
    min: 6
    max: 15
    default: 8
    recommended: [8, 10, 12]
  
  # 后区号码范围
  back_range:
    min: 3
    max: 12
    default: 4
    recommended: [4, 5, 6]
  
  # 成本控制
  cost_control:
    max_cost: 10000  # 最大投注成本 (元)
    warning_threshold: 5000  # 成本警告阈值 (元)
    cost_per_bet: 3  # 每注成本 (元)
  
  # 置信度设置
  confidence:
    min_threshold: 0.5  # 最小置信度阈值
    target_threshold: 0.7  # 目标置信度阈值
    high_threshold: 0.85  # 高置信度阈值

# 分析期数配置
analysis_periods:
  # 期数范围
  range:
    min: 50
    max: 2850  # 更新为支持当前数据量(2804期)+未来增长空间
    default: 500
  
  # 推荐期数（按方法）
  recommended:
    # 深度学习方法
    lstm: 1000
    transformer: 800
    gan: 600
    ensemble: 1200
    
    # 传统机器学习
    markov: 500
    bayesian: 300
    clustering: 400
    
    # 统计方法
    frequency: 200
    hot_cold: 300
    missing: 250
  
  # 自适应期数调整
  adaptive:
    enabled: true
    # 基于数据量调整
    data_size_factor: 0.8
    # 基于模型复杂度调整
    complexity_factor: 1.2
    # 最小调整幅度
    min_adjustment: 0.1

# 预测方法配置
prediction_methods:
  # 深度学习方法
  deep_learning:
    lstm:
      supports_compound: true
      default_epochs: 200
      batch_size: 64
      sequence_length: 50
      compound_candidates: 20
    
    transformer:
      supports_compound: true
      default_epochs: 100
      batch_size: 32
      sequence_length: 20
      compound_candidates: 15
    
    gan:
      supports_compound: true
      default_epochs: 200
      batch_size: 32
      latent_dim: 100
      compound_candidates: 25
  
  # 传统机器学习
  traditional_ml:
    markov:
      supports_compound: true
      max_order: 3
      parallel_jobs: -1
      # 转移概率平滑与回退混合（用于一阶马尔可夫预测）
      smoothing_alpha: 0.05
      global_mix: 0.15
      force_dense: true
      # 时间衰减（用于构建转移概率）
      decay_enabled: true
      decay_half_life: 200
      decay_min_weight: 0.2
      # 后验融合（与频率分布混合）
      posterior_mix: 0.15
    
    bayesian:
      supports_compound: true
      prior_type: "uniform"
      parallel_jobs: -1
      mode: "legacy"
      dirichlet_mix_weight: 0.5
      dirichlet_concentration: 5.0
      decay_enabled: true
      decay_half_life: 200
      decay_min_weight: 0.2
      decay_mode: "segmented"
      recent_window: 100
      mid_window: 300
      recent_weight: 1.0
      mid_weight: 0.7
      old_weight: 0.4
      prior_hot_bonus: 0.2
      prior_warm_bonus: 0.1
      prior_cold_penalty: 0.15
      prior_missing_bias: 0.3
      prior_min_factor: 0.2
    
    clustering:
      supports_compound: true
      n_clusters: 5
      parallel_jobs: -1
  
  # 统计方法
  statistical:
    frequency:
      supports_compound: true
      weight_decay: 0.95
    
    hot_cold:
      supports_compound: true
      hot_threshold: 0.7
      cold_threshold: 0.3

    missing:
      supports_compound: true
      # 遗漏预测模式: auto(按配置), enhanced(增强), legacy(传统)
      mode: "enhanced"
      # 权重策略: log(对数压缩), linear(线性), auto(根据期数自适应)
      weight_strategy: "auto"
      # 预测权重因子 (0-1)
      pred_weight_factor: 0.5
      # 紧迫度因子 (0-1)
      urgency_weight_factor: 0.5
      # 权重下限
      weight_floor: 1.0e-6
      # 去重开关
      dedupe: true
      # 策略阈值 (按分析期数比例)
      extreme_front_ratio: 0.10
      extreme_back_ratio: 0.15
      mid_front_ratio: [0.05, 0.15]
      mid_back_ratio: [0.08, 0.20]
      # 自适应权重（仅在 missing_mode=auto 时生效）
      adaptive_weights:
        enabled: true
        min_periods: 200
        max_periods: 1200
        pred_weight_range: [0.20, 0.90]
        urgency_weight_range: [0.20, 0.90]
        strategy_short: "linear"
        strategy_long: "log"
        thresholds:
          extreme_front_range: [0.18, 0.05]
          extreme_back_range: [0.28, 0.10]
          mid_front_range_low: [0.10, 0.02]
          mid_front_range_high: [0.26, 0.08]
          mid_back_range_low: [0.14, 0.04]
          mid_back_range_high: [0.30, 0.12]
        concentration_penalty:
          enabled: true
          max_adjacent_pairs_front: 2
          max_consecutive_run_front: 2
          min_span_front: 12
          sum_front_range: [60, 125]
          sum_back_range: [5, 20]
          max_resample: 12
          weights:
            adjacent_pairs: 1.0
            consecutive_run: 1.5
            span: 1.0
            sum: 1.0

# 复式选择策略
compound_strategies:
  # 平衡策略
  balanced:
    description: "平衡选择高频和低频号码"
    front_high_ratio: 0.5
    back_high_ratio: 0.5
    diversity_weight: 0.3
  
  # 激进策略
  aggressive:
    description: "优先选择高频号码"
    front_high_ratio: 0.8
    back_high_ratio: 0.8
    diversity_weight: 0.1
  
  # 保守策略
  conservative:
    description: "优先选择中频号码"
    front_high_ratio: 0.3
    back_high_ratio: 0.3
    diversity_weight: 0.5

# 质量控制
quality_control:
  # 预测验证
  validation:
    enabled: true
    # 历史回测期数
    backtest_periods: 100
    # 最小准确率要求
    min_accuracy: 0.1
    # 一致性检查
    consistency_check: true
  
  # 异常检测
  anomaly_detection:
    enabled: true
    # 异常阈值
    threshold: 3.0
    # 检测方法
    methods: ["statistical", "isolation_forest"]
  
  # 多样性检查
  diversity_check:
    enabled: true
    # 最小多样性要求
    min_diversity: 0.3
    # 重复检查
    duplicate_check: true

# 输出格式配置
output_formats:
  # 默认格式
  default: "text"
  
  # 支持的格式
  supported: ["text", "json", "csv", "xml"]
  
  # 格式特定配置
  text:
    include_details: true
    show_confidence: true
    show_cost: true
  
  json:
    pretty_print: true
    include_metadata: true
  
  csv:
    include_headers: true
    separator: ","

# 缓存配置
caching:
  # 是否启用缓存
  enabled: true
  
  # 缓存有效期 (小时)
  ttl:
    compound_results: 24
    analysis_results: 12
    model_predictions: 6
  
  # 缓存大小限制
  size_limits:
    max_entries: 1000
    max_size_mb: 100

# 性能优化
performance:
  # 并行处理
  parallel_processing:
    enabled: true
    max_workers: -1  # -1表示使用所有CPU核心
  
  # 内存管理
  memory_management:
    max_memory_usage: 0.8  # 最大内存使用率
    garbage_collection: true
  
  # 批处理
  batch_processing:
    enabled: true
    batch_size: 100
    
# 实验性功能
experimental:
  # 自适应复式选择
  adaptive_compound_selection:
    enabled: false
    learning_rate: 0.01
  
  # 动态期数调整
  dynamic_periods_adjustment:
    enabled: false
    adjustment_factor: 0.1
  
  # 智能成本优化
  smart_cost_optimization:
    enabled: false
    target_cost: 1000
