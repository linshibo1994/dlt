# DLT Prediction System - Docker Compose
# 大乐透智能预测系统 - 容器编排配置

services:
  # 后端服务 - FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dlt-backend
    restart: unless-stopped
    ports:
      - "6000:6000"
    volumes:
      # 持久化数据目录
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app:/app/backend/app/core:/app/backend/app
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dlt-network

  # 前端服务 - Vue + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dlt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dlt-network

# 网络配置
networks:
  dlt-network:
    driver: bridge
